# FAITH on Unraid: copy to docker-compose.yml next to a .env (see .env.example).
# The config lives in ${FAITH_APPDATA}/config/faith.yaml (start from config/faith.example.yaml).
services:
  faith:
    build: .
    image: faith:local
    container_name: faith
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/Detroit}
    ports:
      - "8097:8097"
      # - "10300:10300"   # speech-to-text for HA's voice pipeline (wyoming: in faith.yaml)
    volumes:
      - ${FAITH_APPDATA:-/mnt/user/appdata/faith}/data:/data
      - ${FAITH_APPDATA:-/mnt/user/appdata/faith}/config:/config
    networks: [ai_net]

  # Wake words for HA's voice satellites: any phrase, as many as you like (wakeword/README.md).
  # Edit ${FAITH_APPDATA}/wake/wake_words.txt; trained models go in ${FAITH_APPDATA}/wake/models.
  faith-wake:
    build: wakeword
    image: faith-wake:local
    container_name: faith-wake
    restart: unless-stopped
    ports:
      - "10400:10400"   # Wyoming: add it in HA as a Wyoming Protocol integration
    volumes:
      - ${FAITH_APPDATA:-/mnt/user/appdata/faith}/wake:/config
    networks: [ai_net]

  # FAITH's own Hermes, for project threads only (docs/projects.md, "FAITH's own Hermes").
  # Build it from hermes-agent (docker build -t hermes-agent .). It's separate from your other
  # Hermes, so the family's project work never lands in the admin's cluster. One profile per person:
  #   docker exec faith-hermes hermes profile create sam
  # then give each profile its own API_SERVER_KEY (in /opt/data/profiles/sam/.env) and copy it
  # into FAITH's .env as FAITH_HERMES_KEY_SAM. Point its model at Argos (docker exec -it faith-hermes
  # hermes setup), so it stays local.
  # faith-hermes:
  #   image: hermes-agent
  #   container_name: faith-hermes
  #   restart: unless-stopped
  #   command: ["gateway", "run"]
  #   environment:
  #     API_SERVER_HOST: 0.0.0.0          # reachable from faith on ai_net only (no ports: published)
  #     API_SERVER_KEY: ${FAITH_HERMES_KEY_DEFAULT}   # Hermes won't serve 0.0.0.0 without a key
  #   volumes:
  #     - ${FAITH_APPDATA:-/mnt/user/appdata/faith}/hermes:/opt/data
  #   networks: [ai_net]

networks:
  ai_net:
    external: true   # where Argos, the wiki, ALLGlance, Coinpile and Orb already are
