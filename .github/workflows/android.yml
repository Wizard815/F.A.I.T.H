# The Android app's APK. It builds on every push that changes android/, from the
# Actions tab (Run workflow), or from a tag like android-v0.1.0, which also makes a
# GitHub release with the APK attached. See docs/android.md ("Get the APK").
name: android
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write   # only used by the release step, on android-v* tags
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      # Optional: the same debug key every run, so a new APK installs over the old one.
      # Without it each run signs with a fresh key and the phone asks you to uninstall first.
      - name: Debug key
        env:
          KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEY" ]; then mkdir -p ~/.android && echo "$KEY" | base64 -d > ~/.android/debug.keystore; fi
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest verifyPaparazziDebug
      - name: Name the APK
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "faith-$v-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: faith-android-apk
          path: android/faith-*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-diffs
          path: android/app/build/paparazzi/failures
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" faith-*.apk --title "FAITH for Android ${GITHUB_REF_NAME#android-v}" --notes "Install the APK on the phone (allow installing from your browser once). See docs/android.md."
