# FAITH: Family Agent for Intelligent Tasks & Help
# Copy to /mnt/user/appdata/faith/config/faith.yaml (mounted at /config/faith.yaml).
# Secrets never go in this file: it names environment variables (*_env) and the
# values live in .env next to the compose file.
# Replace <server-ip> (the machine running your services) and <ha-ip> (Home Assistant) with your own.

name: Faith                      # what the assistant calls itself
family_name: the Wizard household
public_url: https://faith.home.lan   # https is needed for Face ID (passkeys); see docs/hub.md

# The engine: one OpenAI-compatible endpoint. Argos serves the local models.
model:
  base_url: http://argos:8080/v1
  model: faith                   # an Argos model id or alias (a good tool-calling model, e.g. Qwen3)
  # vision_model: qwen2.5-vl     # for photos (the hub camera, Mattermost photos)
  # embed_model: nomic-embed     # lets FAITH pick the right tools when there are many (ha-mcp)
  api_key_env: ARGOS_API_KEY     # leave the variable empty if Argos has no keys
  max_rounds: 6                  # tool rounds per answer
  answer_within_s: 30            # longer is a bigger job: "I'll send you the answer when it's done" (0 = always wait)
  parallel: 1                    # model calls at once; quick questions go ahead of big jobs in the queue
  temperature: 0.4
  history_messages: 16           # past messages sent with each turn
  context_chars: 4000            # how much of the wiki's context_for to include

# The family. ids match the wiki's schema/family.md members.
people:
  - id: wizard
    name: Wizard
    role: admin                  # admin | adult | child
    color: "#7c5cff"
    allglance_owner_id: wizard   # from ALLGlance's allglance_list_users, if it differs
    ha_user_id: ""               # Home Assistant user id: Assist from this HA user acts as Wizard
    face_names: [Wizard]         # what a face-recognition sensor calls him
    mattermost_username: wizard  # his DMs with FAITH in Mattermost act as him
    # omi_uid: "<uid>"            # their Omi account: only its webhook is accepted for them (docs/omi.md)
  - id: partner
    name: Partner
    role: adult
    color: "#ff7a90"
    mattermost_username: partner
# Later:
#  - { id: kid1, name: Kid, role: child, color: "#3fb68b", firefly_account: "Kid's card" }
#    who's home comes from HA's person.<id>; set ha_person: person.other_name if it differs   # the kid's card (docs/rewards.md)

# What each role may do. Defaults shown for child; admin/adult/household allow everything
# their tokens can reach.
roles:
  child:
    writes: allowlist            # allow | allowlist | deny
    allow_writes: [shopping_add, home_control, wiki_memory_capture, wiki_memory_log]   # home_control is limited by ha_domains
    ha_domains: [light, media_player, fan]
    deny_tools: [hermes_*, coinpile_*]
  household:                     # nobody signed in, and the family chat: changes wait for an adult's approval
    deny_tools: [hermes_*]
  # parents:                     # the parents-only chat (writes: allow by default)

# Where the information lives. Each source gets two kinds of token:
#   household_token_env  the blanket family token: shared things only
#   person_token_env     each person's own token ({ID} = their id in capitals):
#                        their private things as well
# No token for a view = that source isn't offered in that view.
connectors:
  - id: wiki
    type: mcp
    url: http://<server-ip>:27123/family-mcp
    description: "The family wiki (LLMWIKI): long-term memory, notes, profiles, today's notes"
    household_token_env: WIKI_TOKEN_HOUSEHOLD   # a shared_agents token: family-setup.mjs add-shared faith FAITH
    # parents_token_env: WIKI_TOKEN_PARENTS     # the grown-ups' chat: add-shared faith-parents "FAITH parents" --audience parents
    person_token_env: WIKI_TOKEN_{ID}           # member tokens: family-setup.mjs token <id>
    tools: [whoami, who_is, family_members, context_for, memory_log, memory_capture, notes_search, note_read, query_wiki, conversation_log]
    always: [memory_log, notes_search]          # offered for every question: remembering and recalling
    teller_tools: [memory_log, memory_capture, memory_add_source]   # a note goes in the teller's own notes
    # For the admin, issue the token "as member" (family-setup.mjs token <id> --label faith --as member):
    # an admin token reads everyone's notes, and FAITH also answers on shared screens.

  - id: allglance
    type: mcp
    url: http://<server-ip>:8090/mcp
    description: "ALLGlance: the family calendar, tasks, chores and life events"
    household_token_env: ALLGLANCE_TOKEN_HOUSEHOLD   # scripts/tokens.mjs add-household faith
    person_token_env: ALLGLANCE_TOKEN_{ID}           # scripts/tokens.mjs add-person <owner_id>
    tools: [allglance_*]

  - id: homeassistant
    type: homeassistant
    url: http://<ha-ip>:8123
    token_env: HA_TOKEN            # long-lived token of a non-admin HA user called "FAITH"
    # person_token_env: HA_TOKEN_{ID}  # optional: HA's logbook then shows who did it
    expose:
      domains: [light, switch, fan, climate, cover, lock, media_player, scene, script, vacuum, sensor, binary_sensor, weather, person]
      entities: []
      exclude: ["*_debug*"]
    confirm_domains: [lock, alarm_control_panel, cover]
    # Mealie, through HA's Mealie integration:
    shopping_lists: [todo.mealie_shopping_list]
    meal_calendars: [calendar.mealie_breakfast, calendar.mealie_lunch, calendar.mealie_dinner]
    mealie_config_entry_id: ""     # Settings > Devices & services > Mealie > ⋮ > copy entry id
                                   # adding recipes (from a photo or a link) is the mealie connector below
    trust_ha_users: true           # Assist from an HA user mapped above acts as that person
    assist_api: true               # HA's own Assist tools and house overview (FAITH integration 0.4+; docs/home-assistant.md)
    fast_path: true                # simple commands go to HA's own sentence matcher first, no model (integration 0.5+)
    cameras:                       # cameras FAITH may look through, and who may ask (docs/home-assistant.md)
      - entity: camera.front_door
        name: Front door
        who: [admin, adult, parents]

  - id: mealie                               # adding recipes from a photo or a link (HA can't add them)
    type: mealie
    url: http://<server-ip>:9000
    token_env: MEALIE_TOKEN                  # Mealie: your profile > API Tokens

  - id: photos                               # Immich: each person's own photo library (docs/setup.md)
    type: immich
    url: http://<server-ip>:2283
    public_url: ""                           # Immich's address outside the house, for share links (https://photos.example.org)
    person_key_env: IMMICH_KEY_{ID}          # each person's own Immich account's API key
    # household_key_env: IMMICH_KEY_FAMILY   # a family account for the shared screens; none: no photos there
    share_days: 7

  - id: coinpile
    type: mcp
    url: http://<server-ip>:8190/api/v1/mcp
    description: "Coinpile: this person's money (Firefly III)"
    person_token_env: COINPILE_TOKEN_{ID}    # scopes mcp + act; no household token: money is never in the shared view
    roles: [admin, adult]

  - id: omi                                  # each person's own Omi (docs/omi.md)
    type: mcp
    url: http://<omi-host>:8000/v1/mcp
    description: "Omi: this person's recorded conversations and memories"
    person_token_env: OMI_TOKEN_{ID}         # their own read-only key; no household token
    tools: ["get_*", "search_*"]
    heard: true                              # what Omi heard is context: changes after it wait for a Yes
    roles: [admin, adult]

  - id: orb
    type: mcp
    url: http://<server-ip>:8095/mcp
    description: "Pondering Orb: this person's dashboard, projects and journal"
    person_token_env: ORB_TOKEN_{ID}         # one Orb per person
    roles: [admin, adult]

  - id: hermes
    type: hermes
    url: http://<server-ip>:8642
    key_env: HERMES_API_KEY_{PROFILE}       # each profile's own API_SERVER_KEY; HERMES_API_KEY_WIZARD
    model: hermes-agent
    roles: [admin, adult]
    # household_profile: household

# Mattermost: a DM with each person, a family channel, a parents channel (docs/mattermost.md).
mattermost:
  url: http://<server-ip>:8065
  team: family                   # the team's URL name; the bot must be a member
  token_env: MATTERMOST_BOT_TOKEN
  answer_in_groups: mention      # in the two channels, only when @faith is mentioned (or "always")
  new_topic_after_minutes: 240   # a chat quiet this long starts fresh; "new topic" does it any time (0 = never)
                                 # the chat put away is filed in that person's wiki folder (memory.file_conversations)
  manage_members: true           # add the family, remove anyone else (no children in the parents' chat)

# The wall screens (paired with `faith pair <id>`).
hub:
  idle_seconds: 120              # no camera: sign out after this long without a tap
  away_seconds: 45               # with a camera: sign out once nobody's there and nobody's tapped for this long
  max_idle_seconds: 900          # with a camera: sign out after this long without a tap, even if someone's there
  max_hours: 8
  show_people_to_unpaired: false
  pin_on_personal_devices: false # PINs only on paired screens
  devices:
    - id: kitchen
      name: Kitchen
      presence_entity: binary_sensor.kitchen_person_occupancy   # Frigate / camera person detection
      face_entity: sensor.kitchen_last_recognized_face           # optional: Frigate face recognition
      face_unlock: false         # true = a recognized face signs in; false = it only highlights their tile
      satellites: []             # voice satellites next to this camera: it checks their voices too
      voice_and_face: false      # true (needs face_unlock): voice and face agree = their own view for that question

personal:
  idle_days: 14
  max_days: 30

memory:
  file_conversations: true       # a person's chat, once put away, is filed in their own wiki folder for Ingest

voice:
  confirm_on_voice: false        # locks etc. by voice need a screen unless this is true
  answer_within_s: 10            # spoken requests: a bigger job says so and goes to the person's chat and phone
  # stt_model: whisper           # Argos model names for speech-to-text and text-to-speech
  # tts_model: tts

# Every source is checked on a schedule; the parents get one message when one goes down
# (two failed checks in a row) and one when it's back. HA gets sensor.faith_integrations_down.
# health:
#   interval_s: 120              # 0 turns it off

# More tools than this: FAITH offers the model only the ones that fit the question
# (ranked by model.embed_model embeddings when set, else by shared words).
# tools:
#   max: 32
#   always: [home_control]

# Points and rewards. Money rewards: manual (recorded as owed) or firefly (a transfer to the kid's card account).
# rewards:
#   allowed_points: [0.5, 1, 2]
#   currency: "$"
#   payout: firefly
#   firefly:
#     url: http://firefly:8080
#     token_env: FIREFLY_TOKEN
#     from_account: Joint checking

# Telling family voices apart (the voiceid service in voiceid/). Enrol voices in the admin page.
# voice_id:
#   url: http://voiceid:8099
#   token_env: VOICEID_TOKEN     # if the service has VOICEID_TOKEN set
#   threshold: 0.78              # how sure before naming someone
#   trust_for_changes: true      # a recognised parent's changes skip approval (false: only logged)
#   face_helps: 0.08             # a voice this far under the threshold counts when the camera there sees that person

# FAITH as speech-to-text for HA's voice pipeline (Wyoming), so satellites know who's talking.
# Publish the port in docker compose; in HA add the Wyoming Protocol integration (FAITH's host, this port).
# wyoming:
#   port: 10300
#   languages: [en]

dashboard:
  entities: [climate.house, lock.front_door, sensor.outside_temperature]
  cards:
    - { id: today, title: Today, builtin: today }
    - { id: meals, title: Meals, builtin: meals }
    - { id: shopping, title: Shopping, builtin: shopping }
    - { id: chores, title: Chores, builtin: chores }
    - { id: home, title: Home, builtin: home }
    - { id: mine, title: My notes, tool: wiki_context_for, args: { person: "{person}" }, who: person }

# The info board in FAITH's apps (docs/dashboard.md): Pondering Orb's Main and Daily pages.
# Projects, the log and the morning brief are each person's own. Everything here is optional.
