/* Layout: one app shell; a wall-tablet hub, the family card, chat, points and admin as tabs. Brass & honey. */
:root {
  --bg: #F6EFE4; --surface: #FCF8F1; --surface-2: #EFE5D5; --line: #E4D7C4; --fg: #2B1E15; --muted: #786350;
  --accent: #9A6B1F; --accent-fg: #FFFAF0; --accent-soft: #F3E4C4; --ok: #4F7A3D; --bad: #B0442F;
  --serif: "Fraunces", Georgia, "Iowan Old Style", serif; --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hex: polygon(50% 0, 93.3% 25%, 93.3% 75%, 50% 100%, 6.7% 75%, 6.7% 25%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #18110C; --surface: #241A13; --surface-2: #1E150F; --line: #3A2B1F; --fg: #F5ECDC; --muted: #B09C84;
  --accent: #DEB25A; --accent-fg: #22160C; --accent-soft: #3A2A16; --ok: #8CBF6E; --bad: #E2745E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #18110C; --surface: #241A13; --surface-2: #1E150F; --line: #3A2B1F; --fg: #F5ECDC; --muted: #B09C84;
  --accent: #DEB25A; --accent-fg: #22160C; --accent-soft: #3A2A16; --ok: #8CBF6E; --bad: #E2745E; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 1.4rem; } h3 { font-size: 1.05rem; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; min-height: 44px; white-space: nowrap; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
button.ghost, button.link { background: transparent; border-color: transparent; color: var(--muted); }
button.link { min-height: 32px; padding: 4px 6px; text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
input { font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px; }
input[type=checkbox] { accent-color: var(--accent); width: 20px; height: 20px; min-height: 0; padding: 0; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .block { display: block; } .grow { flex: 1; min-width: 0; } .right { text-align: right; max-width: 18rem; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-fg); padding: 10px 14px; border-radius: 10px; font-weight: 600; }
.skip:focus { top: 12px; }
.shell { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 8px; } .brand-name { font-family: var(--serif); font-size: 1.35rem; font-weight: 700; letter-spacing: .04em; }
.tag { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tabs button { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; }
.tabs button[aria-current=page] { background: var(--accent-soft); color: var(--fg); border-color: var(--line); box-shadow: inset 0 -2px 0 var(--accent); }
.who { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
main:focus { outline: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; position: relative; overflow: hidden; }
.panel.narrow { max-width: 720px; margin: 0 auto; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hello { font-size: clamp(1.5rem, 3.5vw, 2rem); line-height: 1.15; } .hello em { color: var(--accent); }
.rows { list-style: none; margin: 0 0 14px; padding: 0; }
.rows li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rows li:last-child { border-bottom: 0; }
.time { min-width: 76px; color: var(--muted); font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.check-row { display: flex; align-items: center; gap: 10px; cursor: pointer; } .struck { text-decoration: line-through; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 8px 24px; }
.sect { padding-top: 10px; border-top: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; } .tile .v { font-weight: 600; font-size: 1.1rem; }
.pill { background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 600; min-height: 0; }
.pill.quiet { font-weight: 500; color: var(--muted); }
.count { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 0 7px; font-size: .75rem; font-weight: 700; margin-left: 6px; }
.count.quiet { background: var(--surface-2); color: var(--muted); }
.badge { border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 600; }
.badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); } .badge.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.err { color: var(--bad); } .err:empty { display: none; }
.hex, .hexring { display: inline-grid; place-items: center; clip-path: var(--hex); flex: none; }
.hex { color: #fff; font-weight: 600; } .hexring { padding: 3px; background: var(--accent); }
.emblem { display: block; max-width: 100%; }
/* hub */
.hub { background: radial-gradient(90% 60% at 50% 42%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%), var(--surface); }
.hub-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.clock { font-family: var(--serif); font-size: clamp(2.4rem, 7vw, 3.4rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.hub-mid { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; margin: 10px 0 12px; }
.hub-mid .muted { margin: 0; }
button.orb { background: none; border: 0; padding: 0; border-radius: 50%; margin: -4px 0; }
.hint { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; min-height: 1.1em; }
.heard { color: var(--muted); font-style: italic; }
.reply { font-family: var(--serif); font-size: 1.25rem; line-height: 1.4; max-width: 34em; white-space: pre-wrap; }
.md-line:last-child { white-space: normal; }
.box { border: 1px solid var(--accent); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: min(100%, 30em); }
.box.wait { border-style: dashed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 6px 0; }
.chip { min-height: 36px; padding: 4px 12px; border-radius: 999px; font-size: .88rem; }
.chip.static { min-height: 0; font-size: .75rem; color: var(--muted); border: 1px solid var(--line); background: transparent; }
.ask { display: flex; gap: 6px; margin-top: 10px; } .ask input { flex: 1; min-width: 0; }
.rec { background: var(--bad) !important; color: #fff !important; border-color: var(--bad) !important; }
.faces { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
button.face { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; font-weight: 600; }
.overlay { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: var(--surface); }
.pin { display: flex; flex-direction: column; align-items: center; gap: 10px; } .pin-head { display: flex; align-items: center; gap: 10px; }
.dots { display: flex; gap: 10px; } .dots span { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--muted); } .dots span.on { background: var(--accent); border-color: var(--accent); }
.keys { display: grid; grid-template-columns: repeat(3, 68px); gap: 8px; } .keys button { height: 58px; font-size: 1.35rem; border-radius: 14px; }
/* chat */
.log { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 2px; margin-bottom: 6px; }
.msgw { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; } .msgw.me { align-items: flex-end; }
.msg { max-width: 88%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; }
.msg.me { background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; } .msg.faith { background: var(--surface-2); border-bottom-left-radius: 4px; align-self: flex-start; }
.chips.small { justify-content: flex-start; margin: 0; }
/* points */
.mine { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.honey { display: grid; place-items: center; align-content: center; width: 104px; height: 112px; clip-path: var(--hex); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent)); color: var(--accent-fg); }
.big { font-size: 2.4rem; font-weight: 700; line-height: 1; font-family: var(--serif); } .honey .label { color: inherit; }
.cardbal { margin: 6px 0 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: calc(100% - 32px); }
.toast:empty { display: none; }
@media (max-width: 760px) { .top { justify-content: space-between; } .tabs { order: 3; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } }
@media (max-width: 520px) { .tag { display: none; } .keys { grid-template-columns: repeat(3, 60px); } .time { min-width: 64px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
