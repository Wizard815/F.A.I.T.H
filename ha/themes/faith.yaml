# FAITH's brass-and-honey theme for the family dashboard and wall tablets.
# Copy this file to HA's config/themes/, make sure configuration.yaml has
#   frontend:
#     themes: !include_dir_merge_named themes
# then pick "FAITH" under your profile (or set it per dashboard view / with
# frontend.set_theme in an automation for the kiosk).
FAITH:
  faith-accent: "#86601D"
  faith-accent-text: "#FFFAF0"
  modes:
    light:
      primary-color: "#86601D"
      accent-color: "#DEB25A"
      text-primary-color: "#FFFAF0"
      primary-text-color: "#2B1E15"
      secondary-text-color: "#786350"
      disabled-text-color: "#B3A08A"
      primary-background-color: "#F6EFE4"
      secondary-background-color: "#EFE5D5"
      card-background-color: "#FCF8F1"
      ha-card-background: "#FCF8F1"
      ha-card-border-color: "#E4D7C4"
      ha-card-border-radius: "18px"
      divider-color: "#E4D7C4"
      app-header-background-color: "#F6EFE4"
      app-header-text-color: "#2B1E15"
      sidebar-background-color: "#F1E8DA"
      sidebar-text-color: "#2B1E15"
      sidebar-icon-color: "#786350"
      sidebar-selected-text-color: "#86601D"
      sidebar-selected-icon-color: "#86601D"
      state-icon-color: "#86601D"
      state-icon-active-color: "#C8922E"
      success-color: "#4A6E38"
      warning-color: "#C48024"
      error-color: "#B84838"
      faith-accent: "#86601D"
      faith-accent-text: "#FFFAF0"
    dark:
      primary-color: "#DEB25A"
      accent-color: "#F4D68C"
      text-primary-color: "#22160C"
      primary-text-color: "#F5ECDC"
      secondary-text-color: "#B09C84"
      disabled-text-color: "#6E5C48"
      primary-background-color: "#18110C"
      secondary-background-color: "#1E150F"
      card-background-color: "#241A13"
      ha-card-background: "#241A13"
      ha-card-border-color: "#3A2B1F"
      ha-card-border-radius: "18px"
      divider-color: "#3A2B1F"
      app-header-background-color: "#18110C"
      app-header-text-color: "#F5ECDC"
      sidebar-background-color: "#140E0A"
      sidebar-text-color: "#F5ECDC"
      sidebar-icon-color: "#B09C84"
      sidebar-selected-text-color: "#DEB25A"
      sidebar-selected-icon-color: "#DEB25A"
      state-icon-color: "#C9A060"
      state-icon-active-color: "#F4D68C"
      success-color: "#84B268"
      warning-color: "#E8A846"
      error-color: "#E2745E"
      faith-accent: "#DEB25A"
      faith-accent-text: "#22160C"
