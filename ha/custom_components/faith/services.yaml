send_message:
  fields:
    to:
      required: true
      example: family
      selector:
        text:
    message:
      required: true
      example: The washing machine is done.
      selector:
        text:
          multiline: true
look:
  fields:
    camera:
      required: true
      example: camera.front_door
      selector:
        entity:
          domain: camera
    question:
      required: false
      example: Who is at the door?
      selector:
        text:
    to:
      required: false
      example: parents
      selector:
        text:
award_points:
  fields:
    person:
      required: true
      example: robin
      selector:
        text:
    points:
      required: true
      example: 1
      selector:
        select:
          options: ["0.5", "1", "2"]
    reason:
      required: true
      example: Took the bins out
      selector:
        text:
